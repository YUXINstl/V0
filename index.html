<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看图学统计</title>
  <style>
    :root {
      --blue: #2b6cb0;
      --blue-light: #4299e1;
      --blue-pale: #ebf4ff;
      --blue-soft: #bee3f8;
      --white: #ffffff;
      --ink: #1a365d;
      --gray: #5a6b82;
      --shadow: rgba(43, 108, 176, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(170deg, var(--blue-pale) 0%, var(--white) 60%);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 56px 20px 28px;
    }

    header h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--blue);
      text-shadow: 0 2px 0 var(--white);
    }

    header p {
      margin-top: 12px;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      color: var(--gray);
      letter-spacing: 1px;
    }

    .grid {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px 20px 64px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; gap: 22px; }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--blue-soft);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-8px);
      box-shadow: 0 16px 36px var(--shadow);
      outline: none;
    }

    .card .thumb {
      aspect-ratio: 4 / 3;
      background: var(--blue-pale);
      overflow: hidden;
    }

    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card .label {
      padding: 18px 20px;
      text-align: center;
    }

    .card .label h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--blue);
    }

    .card .label span {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--blue-light);
      letter-spacing: 1px;
    }

    /* 视频弹窗 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 54, 93, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-box {
      background: var(--white);
      border-radius: 18px;
      width: min(900px, 100%);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--blue-pale);
    }

    .modal-head h3 { font-size: 1.05rem; color: var(--blue); }

    .modal-head button {
      border: none;
      background: var(--blue-pale);
      color: var(--blue);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-head button:hover { background: var(--blue-soft); }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--gray);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>看图学统计</h1>
    <p>用可爱的小故事，轻松读懂统计学</p>
  </header>

  <main class="grid" id="grid"></main>

  <!-- 视频弹窗 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">视频</h3>
        <button id="closeBtn" aria-label="关闭">&times;</button>
      </div>
      <div class="video-wrap" id="videoWrap"></div>
    </div>
  </div>

  <footer>看图学统计 · 蓝白主题 · 部署于 GitHub Pages</footer>

  <script>
    /* =========================================================
       配置区：把每个视频的 bvid（推荐）或 aid 填进来即可
       - bvid 示例： "BV1xx411c7XD"
       - 如果你只有 aid，把 bvid 留空，填 aid（纯数字，如 "12345678"）
       ========================================================= */
    const VIDEOS = [
      {
        title: "和狗狗们一起作图",
        img: "images/dogs.png",
        bvid: "BV1xx411c7XD",   // ← 替换为你的 bvid
        aid: ""                  // ← 或填 aid（bvid 留空时使用）
      },
      {
        title: "小兔子们的钟形曲线",
        img: "images/rabbits.png",
        bvid: "BV1xx411c7XD",
        aid: ""
      },
      {
        title: "鸭妈妈和神秘的蛋",
        img: "images/duck.png",
        bvid: "BV1xx411c7XD",
        aid: ""
      },
      {
        title: "小猴子们的扔栗子比赛",
        img: "images/monkeys.png",
        bvid: "BV1xx411c7XD",
        aid: ""
      }
    ];

    /* ---------- 渲染首页卡片 ---------- */
    const grid = document.getElementById("grid");
    VIDEOS.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.innerHTML = `
        <div class="thumb"><img src="${v.img}" alt="${v.title}" /></div>
        <div class="label">
          <h2>${v.title}</h2>
          <span>点击播放视频 ▶</span>
        </div>`;
      card.addEventListener("click", () => openVideo(i));
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openVideo(i); }
      });
      grid.appendChild(card);
    });

    /* ---------- 弹窗逻辑 ---------- */
    const modal = document.getElementById("modal");
    const videoWrap = document.getElementById("videoWrap");
    const modalTitle = document.getElementById("modalTitle");
    const closeBtn = document.getElementById("closeBtn");

    function buildSrc(v) {
      // B站 iframe 嵌入地址，支持 bvid 或 aid
      const params = "page=1&high_quality=1&danmaku=0&autoplay=1";
      if (v.bvid && v.bvid.trim()) {
        return `https://player.bilibili.com/player.html?bvid=${v.bvid.trim()}&${params}`;
      }
      if (v.aid && v.aid.trim()) {
        return `https://player.bilibili.com/player.html?aid=${v.aid.trim()}&${params}`;
      }
      return "";
    }

    function openVideo(i) {
      const v = VIDEOS[i];
      modalTitle.textContent = v.title;
      const src = buildSrc(v);
      videoWrap.innerHTML = src
        ? `<iframe src="${src}" scrolling="no" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>`
        : `<p style="color:#fff;text-align:center;padding:40px;">请先在代码的 VIDEOS 配置中填入该视频的 bvid 或 aid。</p>`;
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeVideo() {
      modal.classList.remove("open");
      videoWrap.innerHTML = ""; // 清空 iframe 以停止播放
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeVideo);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeVideo(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeVideo(); });
  </script>
</body>
</html>
